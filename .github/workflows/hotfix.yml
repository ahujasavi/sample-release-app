# Emergency path: hotfix/* branches skip the develop integration step.
# Tests run immediately; on merge to main the CD pipeline takes over.
name: Hotfix CI

on:
  push:
    branches:
      - "hotfix/*"
  pull_request:
    branches: [main]
    # Only trigger for PRs whose head branch starts with hotfix/
    # (GitHub doesn't support branch-prefix filtering on PR source, so we check in the job)

jobs:
  guard:
    name: Confirm this is a hotfix branch
    runs-on: ubuntu-latest
    steps:
      - run: |
          BRANCH="${{ github.head_ref || github.ref_name }}"
          if [[ "$BRANCH" != hotfix/* ]]; then
            echo "Not a hotfix branch — skipping hotfix CI"
            exit 0
          fi
          echo "Hotfix branch confirmed: $BRANCH"

  test:
    name: Test suite (fast path)
    runs-on: ubuntu-latest
    needs: guard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --tb=short
